name: Build EasyAI Desktop

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable EasyAI source tag (for example v0.1.0)
        required: true
        type: string
      target:
        description: Build all targets or only a selected platform
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
  repository_dispatch:
    types: [easyai-source-tag]

permissions:
  contents: write

concurrency:
  group: easyai-release-${{ inputs.source_ref || github.event.client_payload.source_ref || github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ inputs.source_ref || github.event.client_payload.source_ref }}
  TARGET: ${{ inputs.target || github.event.client_payload.target || 'all' }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.pin.outputs.source_sha }}
      version: ${{ steps.pin.outputs.version }}
      target: ${{ steps.pin.outputs.target }}
    steps:
      - name: Validate dispatch contract
        env:
          DISPATCH_TARGET: ${{ github.event.client_payload.target }}
          SOURCE_REPOSITORY: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REF"
          test -n "$SOURCE_REPOSITORY" || { echo 'BUILD_SOURCE_REPOSITORY is required' >&2; exit 1; }
          test -n "$SOURCE_TOKEN" || { echo 'BUILD_SOURCE_TOKEN is required' >&2; exit 1; }
          case "$TARGET" in
            all|macos|windows) ;;
            *) echo 'target must be all, macos, or windows' >&2; exit 1 ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch && -n "$DISPATCH_TARGET" && "$DISPATCH_TARGET" != "$TARGET" ]]; then
            echo 'repository_dispatch target does not match the resolved target' >&2
            exit 1
          fi
      - name: Check out the immutable source tag
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.BUILD_SOURCE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Pin source and version
        id: pin
        working-directory: source
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          version=$(node -p 'require("./apps/desktop/package.json").version')
          [[ "$SOURCE_REF" == "v$version" ]] || { echo 'source_ref must match Desktop version' >&2; exit 1; }
          [[ "$(git rev-list -n 1 "$SOURCE_REF")" == "$source_sha" ]] || { echo 'source ref is not an immutable tag' >&2; exit 1; }
          printf 'source_sha=%s\nversion=%s\ntarget=%s\n' "$source_sha" "$version" "$TARGET" >> "$GITHUB_OUTPUT"

  windows:
    if: needs.resolve.outputs.target == 'all' || needs.resolve.outputs.target == 'windows'
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.BUILD_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: source/apps/desktop
        shell: pwsh
        run: npm ci
      - name: Prepare Tauri external binaries for verification
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $binaryDirectory = 'apps/desktop/src-tauri/binaries'
          New-Item -ItemType Directory -Force $binaryDirectory | Out-Null
          go build -trimpath -o "$binaryDirectory/easyai-agent-$target.exe" ./cmd/easyai-agent
          # Tauri's build script validates every externalBin before Cargo can
          # compile the session-host binary. Use a temporary placeholder for
          # that second resource, then replace it with the real binary below.
          Copy-Item "$binaryDirectory/easyai-agent-$target.exe" "$binaryDirectory/easyai-session-host-$target.exe" -Force
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin easyai-session-host --target $target
          Copy-Item "apps/desktop/src-tauri/target/$target/debug/easyai-session-host.exe" "$binaryDirectory/easyai-session-host-$target.exe" -Force
      - name: Verify source on Windows
        working-directory: source
        shell: pwsh
        run: |
          go test -count=1 ./...
          go vet ./...
          npm run typecheck --prefix apps/desktop
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Import stable Windows code-signing certificate
        shell: pwsh
        env:
          EASYAI_WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.EASYAI_WINDOWS_CODESIGN_PFX_BASE64 }}
          EASYAI_WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.EASYAI_WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:EASYAI_WINDOWS_CODESIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:EASYAI_WINDOWS_CODESIGN_PFX_PASSWORD)) {
            throw 'The stable EasyAI Windows code-signing GitHub secrets are not configured.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'easyai-windows-codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:EASYAI_WINDOWS_CODESIGN_PFX_BASE64))
          $password = ConvertTo-SecureString $env:EASYAI_WINDOWS_CODESIGN_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
          if ($null -eq $certificate -or -not $certificate.HasPrivateKey) { throw 'The code-signing PFX did not import with its private key.' }
          if ($certificate.Subject -ne 'CN=EasyAI Windows Code Signing') { throw "Unexpected code-signing certificate subject: $($certificate.Subject)" }
          if ($certificate.NotAfter -le [DateTime]::UtcNow) { throw 'The code-signing certificate has expired.' }
          $codeSigningEku = $certificate.Extensions |
            Where-Object { $_.Oid.Value -eq '2.5.29.37' } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            ForEach-Object { $_.Value }
          if ($codeSigningEku -notcontains '1.3.6.1.5.5.7.3.3') { throw 'The imported certificate does not have the Code Signing EKU.' }
          $envLine = "EASYAI_CODE_SIGN_THUMBPRINT=$($certificate.Thumbprint)`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $envLine, [Text.UTF8Encoding]::new($false))
          [IO.File]::Delete($pfxPath)
      - name: Build Windows NSIS installer
        working-directory: source
        shell: pwsh
        run: |
          ./scripts/windows/build-installer.ps1 `
            -Version '${{ needs.resolve.outputs.version }}' `
            -OutputDirectory "$env:GITHUB_WORKSPACE/dist/windows" `
            -CodeSignThumbprint $env:EASYAI_CODE_SIGN_THUMBPRINT `
            -RequireSignature
      - name: Verify Windows installation and shortcuts
        shell: pwsh
        run: |
          ./source/scripts/windows/verify-installer.ps1 `
            -ArtifactDirectory 'dist/windows' `
            -ExpectedCodeSignThumbprint $env:EASYAI_CODE_SIGN_THUMBPRINT `
            -RequireSignature `
            -Launch
      - uses: actions/upload-artifact@v4
        with:
          name: EasyAI-Windows-x64-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 7

  macos:
    if: (needs.resolve.outputs.target == 'all' || needs.resolve.outputs.target == 'macos') && vars.BUILD_MACOS == 'true'
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: x86_64-apple-darwin
            arch: x64
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.BUILD_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: source/apps/desktop
        run: npm ci
      - name: Require macOS signing and notarization secrets
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PROFILE: ${{ secrets.EASYAI_MAC_APP_PROFILE_BASE64 }}
          NETWORK_EXTENSION_PROFILE: ${{ secrets.EASYAI_MAC_NETWORK_EXTENSION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APP_PROFILE NETWORK_EXTENSION_PROFILE; do
            [[ -n "${!name:-}" ]] || { echo "missing macOS release secret: $name" >&2; exit 1; }
          done
      - name: Import Developer ID certificate and provision the system extension
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_PROFILE: ${{ secrets.EASYAI_MAC_APP_PROFILE_BASE64 }}
          NETWORK_EXTENSION_PROFILE: ${{ secrets.EASYAI_MAC_NETWORK_EXTENSION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/easyai-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/easyai-certificate.p12"
          security import "$RUNNER_TEMP/easyai-certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -s "$keychain"
          printf '%s' "$APP_PROFILE" | base64 --decode > "$RUNNER_TEMP/easyai-app.provisionprofile"
          printf '%s' "$NETWORK_EXTENSION_PROFILE" | base64 --decode > "$RUNNER_TEMP/easyai-network-extension.provisionprofile"
          security find-identity -v -p codesigning "$keychain"
          {
            echo "EASYAI_MAC_APP_PROFILE=$RUNNER_TEMP/easyai-app.provisionprofile"
            echo "EASYAI_MAC_NETWORK_EXTENSION_PROFILE=$RUNNER_TEMP/easyai-network-extension.provisionprofile"
          } >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and verify macOS app with Network Extension
        working-directory: source
        env:
          EASYAI_MAC_SIGN: '1'
          EASYAI_MAC_NOTARIZE: '1'
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bash scripts/macos/build.sh \
            '${{ needs.resolve.outputs.version }}' \
            '${{ matrix.arch }}' \
            "$GITHUB_WORKSPACE/dist/macos-${{ matrix.arch }}"
      - name: Collect macOS artifacts
        run: |
          set -euo pipefail
          test -s "dist/macos-${{ matrix.arch }}/EasyAI-${{ needs.resolve.outputs.version }}-macOS-${{ matrix.arch }}.dmg"
          test -s "dist/macos-${{ matrix.arch }}/SHA256SUMS"
          test -s "dist/macos-${{ matrix.arch }}/release.json"
          test -s "dist/macos-${{ matrix.arch }}/version.txt"
          source/scripts/macos/verify-artifacts.sh \
            "$GITHUB_WORKSPACE/dist" \
            '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: EasyAI-macOS-${{ matrix.arch }}-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}
          path: dist/macos-${{ matrix.arch }}/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    if: always() && needs.resolve.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    needs: [resolve, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher
      - uses: actions/download-artifact@v4
        with:
          path: raw-artifacts
          merge-multiple: true
      - name: Assemble and checksum release
        run: |
          set -euo pipefail
          mkdir -p dist
          find raw-artifacts -type f ! -name version.txt ! -name SHA256SUMS -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f \( -name 'EasyAI-*-Windows-x64-Setup.exe' -o -name 'EasyAI-*-macOS-x64.dmg' -o -name 'EasyAI-*-macOS-arm64.dmg' \) -print -quit)"
          (cd dist && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) > SHA256SUMS)
          test -s dist/SHA256SUMS
      - name: Create or update release
        run: |
          set -euo pipefail
          release_tag="v$VERSION"
          release_notes="EasyAI desktop release. Source commit: $SOURCE_SHA"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running a source dispatch must refresh the existing release
            # assets instead of failing with "Release already exists".
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --title "EasyAI $VERSION" --notes "$release_notes"
            gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target main --title "EasyAI $VERSION" --notes "$release_notes" dist/*
          fi
