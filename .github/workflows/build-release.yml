name: Build EasyAI Desktop

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable EasyAI source tag (for example v0.1.0)
        required: true
        type: string
  repository_dispatch:
    types: [easyai-source-tag]

permissions:
  contents: write

concurrency:
  group: easyai-release-${{ inputs.source_ref || github.event.client_payload.source_ref || github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ inputs.source_ref || github.event.client_payload.source_ref }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.pin.outputs.source_sha }}
      version: ${{ steps.pin.outputs.version }}
    steps:
      - name: Validate dispatch contract
        env:
          DISPATCH_TARGET: ${{ github.event.client_payload.target }}
          SOURCE_REPOSITORY: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REF"
          test -n "$SOURCE_REPOSITORY" || { echo 'BUILD_SOURCE_REPOSITORY is required' >&2; exit 1; }
          test -n "$SOURCE_TOKEN" || { echo 'BUILD_SOURCE_TOKEN is required' >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch && -n "$DISPATCH_TARGET" && "$DISPATCH_TARGET" != all ]]; then
            echo 'repository_dispatch target must be all' >&2
            exit 1
          fi
      - name: Check out the immutable source tag
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.BUILD_SOURCE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Pin source and version
        id: pin
        working-directory: source
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          version=$(node -p 'require("./apps/desktop/package.json").version')
          [[ "$SOURCE_REF" == "v$version" ]] || { echo 'source_ref must match Desktop version' >&2; exit 1; }
          [[ "$(git rev-list -n 1 "$SOURCE_REF")" == "$source_sha" ]] || { echo 'source ref is not an immutable tag' >&2; exit 1; }
          printf 'source_sha=%s\nversion=%s\n' "$source_sha" "$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.BUILD_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: source/apps/desktop
        shell: pwsh
        run: npm ci
      - name: Verify source on Windows
        working-directory: source
        shell: pwsh
        run: |
          go test -count=1 ./...
          go vet ./...
          npm run typecheck --prefix apps/desktop
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build portable Windows executable
        working-directory: source
        shell: pwsh
        run: |
          ./scripts/windows/build-portable.ps1 `
            -Version '${{ needs.resolve.outputs.version }}' `
            -OutputDirectory "$env:GITHUB_WORKSPACE/dist/windows"
      - name: Verify portable launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The build script also emits release metadata and checksums. Verify
          # the executable explicitly instead of treating those metadata files
          # as unexpected payloads.
          $portable = Get-Item 'dist/windows/EasyAI.exe' -ErrorAction SilentlyContinue
          if (-not $portable -or $portable.Length -le 0) {
            throw 'Windows build did not produce a non-empty EasyAI.exe'
          }
          $bootstrapper = Start-Process -FilePath $portable.FullName -PassThru
          $bootstrapper.WaitForExit(15000) | Out-Null
          Start-Sleep -Seconds 8
          $desktop = Get-Process -Name 'easyai-desktop' -ErrorAction SilentlyContinue
          if (-not $desktop) { throw 'Portable EasyAI.exe did not launch the Desktop process' }
          $desktop | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with:
          name: easyai-windows-${{ needs.resolve.outputs.source_sha }}
          path: dist/windows/EasyAI.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    if: vars.BUILD_MACOS == 'true'
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: x86_64-apple-darwin
            arch: x64
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.BUILD_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: source/apps/desktop
        run: npm ci
      - name: Build unified EasyAI helper
        working-directory: source
        run: |
          set -euo pipefail
          dir=apps/desktop/src-tauri/binaries
          mkdir -p "$dir"
          GOOS=darwin GOARCH=${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }} go build -trimpath -ldflags '-s -w' -o "$dir/easyai-agent-${{ matrix.target }}" ./cmd/easyai-agent
          cp "$dir/easyai-agent-${{ matrix.target }}" "$dir/easyai-agent"
          config_dir=apps/desktop/src-tauri/config
          mkdir -p "$config_dir"
          cp config/examples/codex-node.windows-x64.example.json "$config_dir/codex.json"
          cp config/examples/claude-code-node.windows-x64.example.json "$config_dir/claude-code.json"
          cp config/examples/hermes-runner.windows-x64.example.json "$config_dir/hermes.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='apps/desktop/src-tauri/tauri.conf.json';
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.bundle.active=true;
          config.bundle.externalBin=['binaries/easyai-agent'];
          config.bundle.resources=['config/*'];
          config.bundle.icon=['icons/icon.ico','icons/icon.png'];
          fs.writeFileSync(file,JSON.stringify(config,null,2)+'\n');
          NODE
      - name: Build macOS app
        working-directory: source/apps/desktop
        run: npm run tauri -- build --bundles app,dmg --target ${{ matrix.target }}
      - name: Collect macOS artifacts
        run: |
          set -euo pipefail
          bundle="source/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          dmg=$(find "$bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          mkdir -p "dist/macos-${{ matrix.arch }}"
          cp "$dmg" "dist/macos-${{ matrix.arch }}/easyai-desktop-macos-${{ matrix.arch }}.dmg"
          printf '%s\n' '${{ needs.resolve.outputs.version }}' > "dist/macos-${{ matrix.arch }}/version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: easyai-macos-${{ matrix.arch }}-${{ needs.resolve.outputs.source_sha }}
          path: dist/macos-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: always() && needs.resolve.result == 'success' && needs.windows.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    needs: [resolve, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher
      - uses: actions/download-artifact@v4
        with:
          path: raw-artifacts
          merge-multiple: true
      - name: Assemble and checksum release
        run: |
          set -euo pipefail
          mkdir -p dist
          find raw-artifacts -type f ! -name version.txt -exec cp {} dist/ \;
          for marker in raw-artifacts/version.txt; do test -f "$marker" || true; done
          (cd dist && sha256sum EasyAI.exe > SHA256SUMS)
          test -s dist/SHA256SUMS
      - name: Create or update release
        run: |
          set -euo pipefail
          tag="v$VERSION"
          title="EasyAI $VERSION"
          notes="Desktop release for Windows and macOS. Source commit: $SOURCE_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A retry or a manual dispatch may target the same version. Keep the
            # release idempotent and refresh the assets produced by this run.
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist/* --clobber
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target main --title "$title" --notes "$notes" dist/*
          fi
