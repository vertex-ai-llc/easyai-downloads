name: Build EasyAI Desktop

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: EasyAI source branch/ref for an artifact build, or matching version tag for a release
        required: true
        type: string
      target:
        description: Build target
        required: true
        type: choice
        options:
          - macos
          - windows
          - all
        default: macos
      publish_release:
        description: Create or update the GitHub Release (requires target all and a version tag)
        required: true
        type: boolean
        default: false
  repository_dispatch:
    types: [easyai-source-tag]

permissions:
  contents: read

concurrency:
  group: easyai-release-${{ inputs.source_ref || github.event.client_payload.source_ref || github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ inputs.source_ref || github.event.client_payload.source_ref }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.pin.outputs.source_sha }}
      version: ${{ steps.pin.outputs.version }}
      target: ${{ steps.contract.outputs.target }}
      publish_release: ${{ steps.contract.outputs.publish_release }}
    steps:
      - name: Validate dispatch contract
        id: contract
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          DISPATCH_TARGET: ${{ github.event.client_payload.target }}
          DISPATCH_PUBLISH_RELEASE: ${{ github.event.client_payload.publish_release }}
          SOURCE_REPOSITORY: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          SOURCE_TOKEN: ${{ secrets.BUILD_SOURCE_TOKEN }}
          BUILD_MACOS: ${{ vars.BUILD_MACOS }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REF"
          test -n "$SOURCE_REPOSITORY" || { echo 'BUILD_SOURCE_REPOSITORY is required' >&2; exit 1; }
          test -n "$SOURCE_TOKEN" || { echo 'BUILD_SOURCE_TOKEN is required' >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch ]]; then
            target="${DISPATCH_TARGET:-all}"
            publish_release="${DISPATCH_PUBLISH_RELEASE:-true}"
          else
            target="${INPUT_TARGET:-macos}"
            publish_release="${INPUT_PUBLISH_RELEASE:-false}"
          fi
          case "$target" in macos|windows|all) ;; *) echo 'target must be macos, windows, or all' >&2; exit 1 ;; esac
          case "$publish_release" in true|false) ;; *) echo 'publish_release must be true or false' >&2; exit 1 ;; esac
          if [[ "$publish_release" == true && "$target" != all ]]; then
            echo 'Publishing a release requires target=all.' >&2
            exit 1
          fi
          if [[ "$target" != windows && "$BUILD_MACOS" != true ]]; then
            echo 'BUILD_MACOS must be true to build macOS artifacts.' >&2
            exit 1
          fi
          printf 'target=%s\npublish_release=%s\n' "$target" "$publish_release" >> "$GITHUB_OUTPUT"
      - name: Check out selected EasyAI source ref
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.BUILD_SOURCE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Pin source and version
        id: pin
        working-directory: source
        env:
          PUBLISH_RELEASE: ${{ steps.contract.outputs.publish_release }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          version=$(node -p 'require("./apps/desktop/package.json").version')
          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch || "$PUBLISH_RELEASE" == true ]]; then
            [[ "$SOURCE_REF" == "v$version" ]] || { echo 'a published release source_ref must match Desktop version' >&2; exit 1; }
            [[ "$(git rev-list -n 1 "$SOURCE_REF")" == "$source_sha" ]] || { echo 'source ref is not an immutable tag' >&2; exit 1; }
          fi
          printf 'source_sha=%s\nversion=%s\n' "$source_sha" "$version" >> "$GITHUB_OUTPUT"

  windows:
    if: needs.resolve.outputs.target == 'all' || needs.resolve.outputs.target == 'windows'
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.BUILD_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: source/apps/desktop
        shell: pwsh
        run: npm ci
      - name: Prepare Tauri external binaries for verification
        working-directory: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $binaryDirectory = 'apps/desktop/src-tauri/binaries'
          New-Item -ItemType Directory -Force $binaryDirectory | Out-Null
          go build -trimpath -o "$binaryDirectory/easyai-agent-$target.exe" ./cmd/easyai-agent
          # Tauri's build script validates every externalBin before Cargo can
          # compile the session-host binary. Use a temporary placeholder for
          # that second resource, then replace it with the real binary below.
          Copy-Item "$binaryDirectory/easyai-agent-$target.exe" "$binaryDirectory/easyai-session-host-$target.exe" -Force
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin easyai-session-host --target $target
          Copy-Item "apps/desktop/src-tauri/target/$target/debug/easyai-session-host.exe" "$binaryDirectory/easyai-session-host-$target.exe" -Force
      - name: Verify source on Windows
        working-directory: source
        shell: pwsh
        run: |
          go test -count=1 ./...
          go vet ./...
          npm run typecheck --prefix apps/desktop
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Import stable Windows code-signing certificate
        shell: pwsh
        env:
          EASYAI_WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.EASYAI_WINDOWS_CODESIGN_PFX_BASE64 }}
          EASYAI_WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.EASYAI_WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:EASYAI_WINDOWS_CODESIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:EASYAI_WINDOWS_CODESIGN_PFX_PASSWORD)) {
            throw 'The stable EasyAI Windows code-signing GitHub secrets are not configured.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'easyai-windows-codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:EASYAI_WINDOWS_CODESIGN_PFX_BASE64))
          $password = ConvertTo-SecureString $env:EASYAI_WINDOWS_CODESIGN_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
          if ($null -eq $certificate -or -not $certificate.HasPrivateKey) { throw 'The code-signing PFX did not import with its private key.' }
          if ($certificate.Subject -ne 'CN=EasyAI Windows Code Signing') { throw "Unexpected code-signing certificate subject: $($certificate.Subject)" }
          if ($certificate.NotAfter -le [DateTime]::UtcNow) { throw 'The code-signing certificate has expired.' }
          $codeSigningEku = $certificate.Extensions |
            Where-Object { $_.Oid.Value -eq '2.5.29.37' } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            ForEach-Object { $_.Value }
          if ($codeSigningEku -notcontains '1.3.6.1.5.5.7.3.3') { throw 'The imported certificate does not have the Code Signing EKU.' }
          $envLine = "EASYAI_CODE_SIGN_THUMBPRINT=$($certificate.Thumbprint)`n"
          [IO.File]::AppendAllText($env:GITHUB_ENV, $envLine, [Text.UTF8Encoding]::new($false))
          [IO.File]::Delete($pfxPath)
      - name: Build Windows NSIS installer
        working-directory: source
        shell: pwsh
        run: |
          ./scripts/windows/build-installer.ps1 `
            -Version '${{ needs.resolve.outputs.version }}' `
            -OutputDirectory "$env:GITHUB_WORKSPACE/dist/windows" `
            -CodeSignThumbprint $env:EASYAI_CODE_SIGN_THUMBPRINT `
            -RequireSignature
      - name: Verify Windows installation and shortcuts
        shell: pwsh
        run: |
          ./source/scripts/windows/verify-installer.ps1 `
            -ArtifactDirectory 'dist/windows' `
            -ExpectedCodeSignThumbprint $env:EASYAI_CODE_SIGN_THUMBPRINT `
            -RequireSignature `
            -Launch
      - uses: actions/upload-artifact@v4
        with:
          name: EasyAI-Windows-x64-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 7

  macos:
    if: (needs.resolve.outputs.target == 'all' || needs.resolve.outputs.target == 'macos') && vars.BUILD_MACOS == 'true'
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: x86_64-apple-darwin
            arch: x64
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BUILD_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.BUILD_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Import Apple signing identity and provisioning profiles
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EASYAI_MAC_APP_PROFILE_BASE64: ${{ secrets.EASYAI_MAC_APP_PROFILE_BASE64 }}
          EASYAI_MAC_NETWORK_EXTENSION_PROFILE_BASE64: ${{ secrets.EASYAI_MAC_NETWORK_EXTENSION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: easyai-${{ github.run_id }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID EASYAI_MAC_APP_PROFILE_BASE64 EASYAI_MAC_NETWORK_EXTENSION_PROFILE_BASE64; do
            [[ -n "${!name}" ]] || { echo "$name is required for the signed macOS build." >&2; exit 1; }
          done
          certificate="$RUNNER_TEMP/easyai-signing.p12"
          app_profile="$RUNNER_TEMP/easyai-app.provisionprofile"
          extension_profile="$RUNNER_TEMP/easyai-network-extension.provisionprofile"
          keychain="$RUNNER_TEMP/easyai-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          printf '%s' "$EASYAI_MAC_APP_PROFILE_BASE64" | base64 -D > "$app_profile"
          printf '%s' "$EASYAI_MAC_NETWORK_EXTENSION_PROFILE_BASE64" | base64 -D > "$extension_profile"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$APPLE_SIGNING_IDENTITY"
          python3 - "$app_profile" "$extension_profile" "$APPLE_TEAM_ID" "$APPLE_SIGNING_IDENTITY" "$keychain" <<'PY'
          import hashlib, plistlib, re, subprocess, sys
          app_profile, extension_profile, team_id, identity, keychain = sys.argv[1:]
          identities = subprocess.check_output(
              ["security", "find-identity", "-v", "-p", "codesigning", keychain], text=True
          )
          matching_identity_hashes = {
              fingerprint.upper()
              for fingerprint, label in re.findall(r'^\s*\d+\)\s+([A-Fa-f0-9]{40})\s+"([^"]+)"', identities, re.M)
              if label == identity
          }
          if not matching_identity_hashes:
              raise SystemExit("The requested Developer ID Application identity is not in the temporary keychain.")
          expected = [
              (app_profile, team_id + ".com.postlyn.easyai", "app"),
              (extension_profile, team_id + ".com.postlyn.easyai.networkextension", "extension"),
          ]
          for path, app_identifier, role in expected:
              decoded = subprocess.check_output(["security", "cms", "-D", "-i", path])
              profile = plistlib.loads(decoded)
              entitlements = profile.get("Entitlements", {})
              if entitlements.get("com.apple.application-identifier") != app_identifier:
                  raise SystemExit(f"{role} profile App ID does not match {app_identifier}.")
              if team_id not in profile.get("TeamIdentifier", []):
                  raise SystemExit(f"{role} profile Team ID does not match {team_id}.")
              if not matching_identity_hashes.intersection(
                  hashlib.sha1(certificate).hexdigest().upper()
                  for certificate in profile.get("DeveloperCertificates", [])
              ):
                  raise SystemExit(f"{role} profile does not include the imported signing certificate.")
              if "app-proxy-provider-systemextension" not in entitlements.get(
                  "com.apple.developer.networking.networkextension", []
              ):
                  raise SystemExit(f"{role} profile does not authorize the App Proxy System Extension.")
              if role == "app" and entitlements.get("com.apple.developer.system-extension.install") is not True:
                  raise SystemExit("The host app profile does not authorize System Extension installation.")
          print("Apple profiles, bundle IDs, entitlements, Team ID, and signing certificate match.")
          PY
          rm -f "$certificate"
          {
            printf 'EASYAI_MAC_APP_PROFILE=%s\n' "$app_profile"
            printf 'EASYAI_MAC_NETWORK_EXTENSION_PROFILE=%s\n' "$extension_profile"
          } >> "$GITHUB_ENV"
      - name: Build, sign, notarize and staple macOS packages
        working-directory: source
        env:
          EASYAI_MAC_SIGN: '1'
          EASYAI_MAC_NOTARIZE: '1'
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/macos/build.sh "$VERSION" "$ARCH" dist/macos
      - name: Remove temporary Apple signing material
        if: always()
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/easyai-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/easyai-signing.p12" \
            "$RUNNER_TEMP/easyai-app.provisionprofile" \
            "$RUNNER_TEMP/easyai-network-extension.provisionprofile"
      - uses: actions/upload-artifact@v4
        with:
          name: EasyAI-macOS-${{ matrix.arch }}-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.source_sha }}
          path: source/dist/macos/macos-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.publish_release == 'true' && needs.windows.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    needs: [resolve, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher
      - uses: actions/download-artifact@v4
        with:
          path: raw-artifacts
          merge-multiple: true
      - name: Assemble and checksum release
        run: |
          set -euo pipefail
          mkdir -p dist
          find raw-artifacts -type f ! -name version.txt ! -name SHA256SUMS -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name 'EasyAI-*-Windows-x64-Setup.exe' -print -quit)"
          (cd dist && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) > SHA256SUMS)
          test -s dist/SHA256SUMS
      - name: Create or update release
        run: |
          set -euo pipefail
          release_tag="v$VERSION"
          release_notes="EasyAI Windows installer (NSIS). Install once to create Start Menu and Desktop shortcuts. Source commit: $SOURCE_SHA"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running a source dispatch must refresh the existing release
            # assets instead of failing with "Release already exists".
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --title "EasyAI $VERSION" --notes "$release_notes"
            gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target main --title "EasyAI $VERSION" --notes "$release_notes" dist/*
          fi
